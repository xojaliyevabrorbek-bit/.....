<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08102c">
<title>Сарф — феъл шакллари</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root{--bg1:#060b20;--bg2:#101c46;--ink:#e9edff;--mute:#a9b4da;--card:rgba(22,35,80,.78);--line:rgba(150,172,255,.22);--p:#f2cf6b;--p2:#d9b54a;--teal:#5fd0c8;--ok:#62e3a6;--okbg:rgba(46,150,104,.28);--bad:#ff9a9a;--badbg:rgba(190,60,70,.28)}
*{box-sizing:border-box}
html{scroll-padding-bottom:90px}
body{margin:0;color:var(--ink);font:16px/1.55 "Source Serif 4",Georgia,serif;min-height:100vh;
background-color:#08102c;
background-image:
radial-gradient(1.6px 1.6px at 22px 34px,#fff,transparent 60%),
radial-gradient(1px 1px at 84px 124px,#dfe7ff,transparent 60%),
radial-gradient(1.4px 1.4px at 152px 64px,#fff,transparent 60%),
radial-gradient(1px 1px at 214px 176px,#c9d6ff,transparent 60%),
radial-gradient(2px 2px at 266px 92px,#ffe9a8,transparent 60%),
radial-gradient(1px 1px at 40px 190px,#fff,transparent 60%),
radial-gradient(1.2px 1.2px at 180px 20px,#cfe0ff,transparent 60%),
linear-gradient(180deg,#050a1d 0%,#0b1538 45%,#14265a 100%);
background-size:300px 220px,300px 220px,300px 220px,300px 220px,300px 220px,300px 220px,300px 220px,100% 100%;
background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
background-image:radial-gradient(1.8px 1.8px at 60px 80px,#fff,transparent 60%),radial-gradient(1.5px 1.5px at 190px 150px,#ffeab5,transparent 60%),radial-gradient(1.3px 1.3px at 120px 30px,#fff,transparent 60%);
background-size:260px 200px;animation:tw 4.5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
@media(prefers-reduced-motion:reduce){body::before{animation:none;opacity:.7}}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:14px 16px 110px}
h1{font-size:1.8rem;margin:.2em 0 0}h2{font-size:1.1rem;margin:1.5em 0 .5em;color:var(--p)}h3{font-size:1rem;margin:1.1em 0 .3em}
.top{text-align:center;position:relative;padding:8px 0 12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.top .ar{display:block;font-size:2.3rem;color:var(--p);line-height:1.6}
.sub{margin:0;color:var(--mute)}
.moon{position:absolute;right:2px;top:6px;opacity:.9}
.ar{font-family:Amiri,"Traditional Arabic","Geeza Pro","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;line-height:2}
button,.btn{font:inherit;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--p)}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--p);outline-offset:2px}
button.primary{background:var(--p);color:#1b1630;border-color:var(--p);padding:12px 22px;font-weight:600}
button.primary:hover{background:var(--p2)}button.primary:disabled{opacity:.45;cursor:not-allowed}
button.on{border-color:var(--p);box-shadow:inset 0 0 0 1px var(--p)}
button.link{border:0;background:none;color:var(--mute);text-decoration:underline;padding:4px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;backdrop-filter:blur(3px)}
a.card{display:block;color:inherit;text-decoration:none}a.card:hover{border-color:var(--p)}
.card b{color:var(--p)}.mute{color:var(--mute)}
#cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:12px}
#cats label{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;user-select:none}
#cats input{position:absolute;opacity:0}#cats label:has(input:checked){background:var(--p);color:#1b1630;border-color:var(--p);font-weight:600}
#cats label:has(input:focus-visible){outline:3px solid var(--p)}
.radios{display:flex;flex-direction:column;gap:6px}.info{color:var(--mute);min-height:1.5em}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--mute)}
.track{height:5px;background:rgba(255,255,255,.14);border-radius:3px;margin:6px 0 20px}#fill{height:100%;width:0;background:var(--p);border-radius:3px;transition:width .25s}
.badge{display:inline-block;border:1px solid var(--p);color:var(--p);border-radius:999px;padding:2px 12px;font-size:.9rem;margin-bottom:6px}
.qlabel{color:var(--mute);margin:0}
.qtext{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 16px;margin:8px 0 16px;text-align:center;font-size:1.3rem}
.qtext.ar{font-size:2.1rem;line-height:2.2}
#options{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:12px;width:100%}
.opt.ar{text-align:right;font-size:1.5rem;padding:8px 16px;line-height:2.1}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}.opt:disabled{cursor:default;color:var(--ink)}
#fb{min-height:1.4em;color:var(--mute);margin:10px 0 0;text-align:center}
#next{margin-top:14px;width:100%}
.score{display:flex;align-items:baseline;gap:18px;margin:10px 0}#sc{font-size:2.6rem;font-weight:600}#pc{font-size:2rem;color:var(--p)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.w{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:12px 14px;margin:10px 0}
.w .q{font-size:1.1rem}.w .q.ar{font-size:1.5rem}.w .m{color:var(--mute);font-size:.9rem;margin:2px 0}
.good{color:var(--ok)}.badt{color:var(--bad)}.allok{color:var(--ok);font-size:1.2rem;margin:18px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:0;background:rgba(6,11,32,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
.tabs a{flex:1;max-width:240px;text-align:center;padding:10px 4px 9px;color:var(--mute);text-decoration:none;font-size:.9rem}
.tabs a b{display:block;font-size:1.25rem;line-height:1.1}.tabs a[aria-current]{color:var(--p)}
.pill{display:inline-block;font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--mute);margin-left:6px}
table.t{width:100%;border-collapse:collapse;margin:6px 0}table.t td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
table.t td.a{font-size:1.45rem;text-align:right;white-space:nowrap;width:1%;padding-right:12px}
.small{font-size:.88rem;color:var(--mute)}
.flash{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:20px}
.flash .ar{font-size:2.2rem}.flash .sg{color:var(--mute);margin-top:6px;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;direction:rtl}
.chip{font-size:1.5rem;padding:2px 12px;border-radius:10px;line-height:1.9}
.chip.done{opacity:.4;text-decoration:line-through}
.step{display:flex;gap:10px;margin:8px 0}.step i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--p);color:#1b1630;font-style:normal;text-align:center;font-weight:700;line-height:26px}
.chain{font-size:1.7rem;text-align:center;direction:rtl;line-height:2.1;margin:6px 0}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--mute);justify-content:center}
svg text{font-family:inherit}
.stars-svg{width:100%;height:auto;display:block}
.stars-svg a{cursor:pointer}.stars-svg a:focus-visible{outline:none}.stars-svg a:focus-visible .st{stroke:#fff;stroke-width:2}

a.link{color:var(--mute);text-decoration:underline;display:inline-block;margin:6px 0}a.link:hover{color:var(--p)}

</style></head>

<header class="top"><svg class="moon" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="M30 6a17 17 0 1 0 8 30A14 14 0 0 1 30 6z" fill="#f2cf6b"/><circle cx="12" cy="10" r="1.3" fill="#fff"/><circle cx="38" cy="22" r="1" fill="#fff"/></svg><span class="ar" lang="ar">عِلْمُ الصَّرْفِ</span><h1>Сарф</h1><p class="sub">«Мабдаус сарф» китоби асосида · феъл шакллари</p></header>

  <div id="cats"></div>

  <p id="info" class="info"></p>
  <button id="start" class="primary">Бошлаш</button>
</section>
<section id="s-quiz" hidden>

  <div class="track"><div id="fill"></div></div>
  <span id="badge" class="badge"></span>
  <p id="qlabel" class="qlabel"></p><div id="qtext" class="qtext"></div>
  <div id="options"></div><p id="fb"></p><button id="next" class="primary" hidden>Кейингиси</button>
</section>
<section id="s-result" hidden>
  <h1>Натижа</h1>
  <div class="score"><span id="sc"></span><span id="pc"></span></div>
  <p id="detail"></p><p id="allok" class="allok" hidden>Барча саволлар тўғри!</p>
  <div class="row"><button id="retryWrong" class="primary">Хатоларни қайта ишлаш</button><button id="again">Яна</button></div>
  <h2 id="wrongTitle">Хато қилинган саволлар</h2><div id="wrongList"></div>
</section>
<section id="s-learn" hidden></section>
<section id="s-topic" hidden></section>
<section id="s-stars" hidden></section>
<section id="s-notebook" hidden></section>
</main>

 amr_goib_majhul:{pg:'35–36',r:['Амри ғоиб феълининг мажҳули 14 сийғада келади.','Бу феълда истисно тарзида аввал мухотаб сийғаси сарфланади, кейин ғоиб ва мутакаллим сийғалари.'],steps:['Мажҳул музореънинг аввалига لِ келтирилади ва охирги ҳаракат туширилади (масалан, لِيُضْرَبْ).'],
  ex:['amr_goib_majhul-1','amr_goib_majhul-4','amr_goib_majhul-7','amr_goib_majhul-13','amr_goib_majhul-14'],rem:['Тартиб: аввал 6 мухотаб, кейин 6 ғоиб, сўнг 2 мутакаллим.'],exs:[]}
};

</script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const strip=s=>s.replace(/[\u064B-\u065F\u0670\u0640]/g,'');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
const words=s=>new Set(s.toLowerCase().replace(/[,.]/g,'').split(/\s+/).filter(Boolean));
function sim(a,b,ar){if(ar){const x=strip(a),y=strip(b);return 1-lev(x,y)/Math.max(x.length,y.length)+(a.split(' ')[0]===b.split(' ')[0]?.2:0);}
  const A=words(a),B=words(b);let i=0;A.forEach(w=>{if(B.has(w))i++;});return i/Math.max(1,A.size+B.size-i);}

/* ---------- маълумот ---------- */
let DATA=[];
try{ if(!Array.isArray(SARF_DATA)||!SARF_DATA.length) throw 0; DATA=SARF_DATA; }
catch(e){ document.body.innerHTML='<main><p>Маълумотлар юкланмади. Саҳифани янгиланг.</p></main>'; return; }
const byId={};DATA.forEach(d=>byId[d.id]=d);
const CATS=[];DATA.forEach(d=>{if(!CATS.find(c=>c.id===d.category))CATS.push({id:d.category,name:d.categoryName});});
const catName=id=>CATS.find(c=>c.id===id).name;
const arCount={};DATA.forEach(d=>{arCount[d.arabic]=(arCount[d.arabic]||0)+1;});
const ambiguous=d=>arCount[d.arabic]>1;

/* ---------- сақлаш (фақат шу қурилмада) ---------- */
const LS='sarf.menu.v1';
function load(){try{return JSON.parse(localStorage.getItem(LS))||{};}catch(e){return {};}}
let store=Object.assign({topics:{},notebook:{}},load());
function save(){try{localStorage.setItem(LS,JSON.stringify(store));}catch(e){}}
function record(item,ok){
  const t=store.topics[item.category]||(store.topics[item.category]={recent:[],total:0,correct:0});
  t.recent.push(ok?1:0);if(t.recent.length>20)t.recent.shift();t.total++;if(ok)t.correct++;
  const nb=store.notebook;
  if(!ok){const e=nb[item.id]||(nb[item.id]={wrong:0,streak:0});e.wrong++;e.streak=0;}
  else if(nb[item.id]){nb[item.id].streak++;if(nb[item.id].streak>=2)delete nb[item.id];}
  save();
}
function level(cat){const t=store.topics[cat],n=t?t.recent.length:0;if(n<5)return 0;
  const r=t.recent.reduce((a,b)=>a+b,0)/n;if(r<0.6)return 1;if(r>=0.85&&n>=10)return 3;return 2;}
const LV=['Бошланмаган','Хира','Ёруғ','Порлоқ'];

/* ---------- саволлар ---------- */
function makeQuestion(item,dir,cats){
  if(dir==='sigha'){
    const valid=DATA.filter(d=>d.category===item.category&&d.arabic===item.arabic).map(d=>d.sigha);
    const vs=new Set(valid),used=new Set(vs),picked=[];
    const tiers=[DATA.filter(d=>d.category===item.category),DATA.filter(d=>cats.includes(d.category)),DATA];
    for(const t of tiers){
      const c=t.filter(d=>!used.has(d.sigha)).map(d=>({s:d.sigha,k:sim(d.sigha,item.sigha,false)+Math.random()*.1})).sort((a,b)=>b.k-a.k);
      for(const x of c){if(picked.length>=3)break;if(used.has(x.s))continue;used.add(x.s);picked.push(x.s);}
      if(picked.length>=3)break;
    }
    return{item,dir,valid,opts:shuffle([{text:item.sigha,ok:true},...picked.map(s=>({text:s,ok:false}))])};
  }
  const toUz=dir==='ar-uz',side=toUz?'uzbek':'arabic';
  const clash=c=>c===item||c.arabic===item.arabic||c.uzbek===item.uzbek;
  const tiers=[DATA.filter(d=>d.category===item.category),DATA.filter(d=>cats.includes(d.category)),DATA];
  const used=new Set([item[side]]),picked=[];
  for(const t of tiers){
    const c=t.filter(d=>!clash(d)).map(d=>({d,s:sim(d[side],item[side],!toUz)+Math.random()*.1})).sort((a,b)=>b.s-a.s);
    for(const {d} of c){if(picked.length>=3)break;if(used.has(d[side]))continue;used.add(d[side]);picked.push(d);}
    if(picked.length>=3)break;
  }
  return{item,dir,valid:[item.sigha],opts:shuffle([item,...picked]).map(d=>({text:d[side],ok:d===item}))};
}
function pickDir(it,mode){
  if(mode==='sigha')return 'sigha';
  const types=mode==='all'?['ar-uz','uz-ar','sigha']:['ar-uz','uz-ar'];
  const ok=types.filter(t=>!(t==='ar-uz'&&ambiguous(it)));
  return mode==='ar-uz'||mode==='uz-ar'?mode:ok[Math.floor(Math.random()*ok.length)];
}
const buildTest=(items,mode)=>{const cats=[...new Set(items.map(i=>i.category))];return shuffle(items).map(it=>makeQuestion(it,pickDir(it,mode),cats));};
const pool=(cats,mode)=>DATA.filter(d=>cats.includes(d.category)&&(mode!=='ar-uz'||!ambiguous(d)));

/* ---------- экранлар ва йўналиш ---------- */
const SCREENS=['setup','quiz','result','learn','topic','stars','notebook'];
function showScreen(id){SCREENS.forEach(s=>{$('#s-'+s).hidden=s!==id;});window.scrollTo(0,0);}
function setTab(n){$$('.tabs a').forEach((a,i)=>{if(i===n)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}
let preselect=null;
function route(p){
  const raw=typeof p==='string'?p:(function(){try{return location.hash;}catch(e){return '';}})();const h=raw.replace(/^#?\/?/,'')||'tests';const [a,b]=h.split('/');
  S=null;
  if(a==='learn'&&b&&(TOP[b]||b==='intro')){setTab(1);renderTopic(b);}
  else if(a==='learn'){setTab(1);renderLearn();}
  else if(a==='stars'){setTab(2);renderStars();}
  else if(a==='sigha'){setTab(2);renderSetup('sigha');}
  else if(a==='notebook'){setTab(2);renderNotebook();}
  else{setTab(0);renderSetup('test');}
}
function go(p){try{history.replaceState(null,'','#'+p);}catch(e){}route(p);}
document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.dataset.go);}});
window.addEventListener('hashchange',()=>route());

/* ---------- созлаш ---------- */
let count=10,kind='test',S=null;
CATS.forEach(c=>{const lb=el('label');lb.innerHTML=`<input type="checkbox" value="${c.id}"> ${c.name}`;$('#cats').append(lb);});
const sel=()=>$$('#cats input:checked').map(i=>i.value);
const modeNow=()=>kind==='sigha'?'sigha':document.querySelector('input[name=dir]:checked').value;
function refreshInfo(){
  const cs=sel(),m=modeNow(),n=pool(cs,m).length,q=count===0?n:Math.min(count,n);
  $('#info').textContent=cs.length?`${cs.length} та мавзу, ${n} та савол мавжуд. Тестда: ${q}`+(m==='ar-uz'?' (бир хил ёзиладиган арабча шакллар бу йўналишда чиқмайди)':''):'Камида битта мавзу танланг.';
  $('#start').disabled=!cs.length;
}
function renderSetup(k){
  kind=k;showScreen('setup');
  $('#setupTitle').textContent=k==='sigha'?'Сийғани топ':'Тестлар';
  $('#setupLead').textContent=k==='sigha'?'Арабча шакл чиқади — унинг қайси сийғага (шахс, жинс, сон) тегишли эканини топинг.':'Ҳар бир мавзу алоҳида тест. Битта ёки бир нечта мавзуни танлашингиз мумкин.';
  $('#dirBox').hidden=k==='sigha';
  $$('#cats input').forEach(i=>{i.checked=preselect?i.value===preselect:false;});
  if(!preselect)$$('#cats input')[0].checked=true;
  preselect=null;refreshInfo();
}
$$('[data-r]').forEach(b=>b.onclick=()=>{const r=b.dataset.r;
  $$('#cats input').forEach(i=>{i.checked=r==='all'||(r==='malum'&&!i.value.includes('majhul')&&!i.value.includes('amr'))||(r==='majhul'&&i.value.includes('majhul'))||(r==='amr'&&i.value.startsWith('amr'));});refreshInfo();});
$$('#counts button').forEach(b=>b.onclick=()=>{$$('#counts button').forEach(x=>x.classList.remove('on'));b.classList.add('on');count=+b.dataset.n;refreshInfo();});
$('#cats').addEventListener('change',refreshInfo);$$('input[name=dir]').forEach(i=>i.onchange=refreshInfo);
$('#start').onclick=()=>{const cs=sel(),m=modeNow(),p=pool(cs,m);if(!p.length)return;
  start(shuffle(p).slice(0,count===0?p.length:Math.min(count,p.length)),m,kind==='sigha'?'/sigha':'/tests');};

/* ---------- тест ---------- */
function start(items,m,origin){S={qs:buildTest(items,m),i:0,ok:0,wrong:[],mode:m,origin};showScreen('quiz');show();}
function show(){
  const q=S.qs[S.i],n=S.qs.length,toUz=q.dir==='ar-uz',sg=q.dir==='sigha';
  $('#progress').textContent=`${S.i+1} / ${n}`;$('#fill').style.width=(S.i/n*100)+'%';
  $('#badge').textContent=q.item.categoryName;
  $('#qlabel').textContent=sg?'Бу шакл қайси сийғага тегишли?':toUz?'Ўзбекча маъносини топинг':'Арабча шаклини топинг';
  const t=$('#qtext');t.textContent=(toUz||sg)?q.item.arabic:q.item.uzbek;t.className='qtext'+((toUz||sg)?' ar':'');
  const box=$('#options');box.innerHTML='';
  q.opts.forEach((o,k)=>{const b=el('button','opt'+((!toUz&&!sg)?' ar':''),o.text);b.onclick=()=>answer(k);box.append(b);});
  $('#fb').textContent='';$('#next').hidden=true;q.done=false;
}
function answer(k){
  const q=S.qs[S.i];if(q.done)return;q.done=true;q.picked=k;
  const bs=$$('.opt');bs.forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add('ok');});
  const ok=q.opts[k].ok;if(ok)S.ok++;else{bs[k].classList.add('bad');S.wrong.push(q);}
  record(q.item,ok);
  $('#fb').textContent=q.dir==='sigha'?(q.valid.length>1?'Бу шакл бир неча сийғага тўғри келади: '+q.valid.join(' · '):'Маъноси: '+q.item.uzbek):'Сийға: '+q.item.sigha;
  $('#next').textContent=S.i===S.qs.length-1?'Натижани кўриш':'Кейингиси';$('#next').hidden=false;$('#next').focus();
}
$('#next').onclick=()=>{S.i<S.qs.length-1?(S.i++,show()):finish();};
function ask(btn,label,fn){if(btn.dataset.arm){delete btn.dataset.arm;fn();return;}const old=btn.textContent;btn.dataset.arm='1';btn.textContent=label;setTimeout(()=>{if(btn.dataset.arm){delete btn.dataset.arm;btn.textContent=old;}},3500);}
$('#quit').onclick=()=>ask($('#quit'),'Ростдан тугатамизми? Яна босинг',()=>{$('#quit').textContent='Тугатиш';S.qs=S.qs.slice(0,S.i+(S.qs[S.i].done?1:0));S.qs.length?finish():go(S.origin);});
document.addEventListener('keydown',e=>{if($('#s-quiz').hidden)return;
  if(/^[1-4]$/.test(e.key))answer(+e.key-1);else if(e.key==='Enter'&&!$('#next').hidden)$('#next').click();});
function finish(){
  const n=S.qs.length,ok=S.ok;showScreen('result');
  $('#sc').textContent=`Натижа: ${ok} / ${n}`;$('#pc').textContent=Math.round(ok/n*100)+'%';
  $('#detail').textContent=`Жами саволлар: ${n}. Тўғри: ${ok}. Нотўғри: ${n-ok}.`;
  const w=S.wrong,L=$('#wrongList');L.innerHTML='';
  $('#allok').hidden=!!w.length;$('#wrongTitle').hidden=!w.length;$('#retryWrong').hidden=!w.length;
  w.forEach(q=>{const toUz=q.dir==='ar-uz',sg=q.dir==='sigha',d=el('div','w');
    const row=(lab,txt,ar,c)=>{const r=el('div','a '+c);r.append(lab+': ');r.append(el('span',ar?'ar':'',txt));return r;};
    d.append(el('div','m','Савол · '+q.item.categoryName),el('div','q'+((toUz||sg)?' ar':''),(toUz||sg)?q.item.arabic:q.item.uzbek),
      row('Сизнинг жавобингиз',q.opts[q.picked].text,!toUz&&!sg,'badt'),row('Тўғри жавоб',q.opts.find(o=>o.ok).text,!toUz&&!sg,'good'),
      el('div','m','Сийға: '+q.item.sigha+' · китоб '+q.item.source.pages+'-бет'));
    L.append(d);});
}
$('#again').onclick=()=>go(S.origin);
$('#retryWrong').onclick=()=>start(S.wrong.map(q=>q.item),S.mode,S.origin);

/* ---------- 2-бўлим: ўрганиш ---------- */
const para=(t)=>`<p>${t}</p>`;
function renderLearn(){
  showScreen('learn');
  let h=`<h1>Ўрганиш</h1><p class="sub">«Мабдаус сарф» китобидаги мавзулар: қоида, мисол, жадвал, карточка ва китобдаги машқлар.</p>
  <a class="card" href="#" data-go="/learn/intro"><b>Умумий тушунчалар</b><div class="small">Замонлар, сийға, шахс ва жинс, маълум ва мажҳул</div></a>`;
  CATS.forEach(c=>{const lv=level(c.id);h+=`<a class="card" href="#" data-go="/learn/${c.id}"><b>${c.name}</b><span class="pill">${LV[lv]}</span><div class="small">Китоб: ${TOP[c.id].pg}-бетлар</div></a>`;});
  $('#s-learn').innerHTML=h;
}
const arSpan=t=>`<span class="ar">${t}</span>`;
function renderTopic(id){
  showScreen('topic');const root=$('#s-topic');
  if(id==='intro'){
    let h=`<a class="link" href="#" data-go="/learn">← Мавзулар</a><h1>${INTRO.title}</h1>`;
    INTRO.blocks.forEach(b=>{h+=`<h2>${b.h}</h2><div class="card">${b.p.map(para).join('')}</div>`;});
    const moz=DATA.filter(d=>d.category==='mozi');
    h+=`<h2>14 та сийғанинг номлари</h2><div class="card"><table class="t">${moz.map(d=>`<tr><td>${d.order}.</td><td>${d.sigha}</td></tr>`).join('')}</table><div class="small">Китобнинг 22–23-бетларидан.</div></div>`;
    h+=`<a class="btn primary" href="#" data-go="/learn" style="margin-top:12px">Мавзуларга ўтиш</a>`;
    root.innerHTML=h;return;
  }
  const T=TOP[id],name=catName(id),rows=DATA.filter(d=>d.category===id);
  const idx=CATS.findIndex(c=>c.id===id),prev=CATS[idx-1],next=CATS[idx+1];
  let h=`<a class="link" href="#" data-go="/learn">← Мавзулар</a><h1>${name}</h1><p class="sub">Китоб: ${T.pg}-бетлар</p>`;
  h+=`<h2>Қоида</h2><div class="card">${T.r.map(para).join('')}</div>`;
  if(T.chain)h+=`<h2>Босқичма-босқич</h2><div class="card"><div class="chain ar">${T.chain.map((x,i)=>(i?'← ':'')+x).join(' ')}</div></div>`;
  if(T.steps)h+=`<h2>Қандай ясалади</h2><div class="card">${T.steps.map((s,i)=>`<div class="step"><i>${i+1}</i><div>${s}</div></div>`).join('')}</div>`;
  if(T.pairs)h+=`<h2>Китобдаги мисоллар</h2><div class="card"><table class="t">${T.pairs.map(p=>`<tr><td class="a ar">${p[0]}</td><td class="a ar">${p[1]}</td></tr>`).join('')}</table></div>`;
  if(T.ex)h+=`<h2>Жадвалдан мисоллар</h2><div class="card"><table class="t">${T.ex.map(i=>byId[i]).filter(Boolean).map(d=>`<tr><td class="a ar">${d.arabic}</td><td>${d.uzbek}<div class="small">${d.sigha}</div></td></tr>`).join('')}</table></div>`;
  h+=`<h2>Эсда тут</h2><div class="card"><ul>${T.rem.map(r=>`<li>${r}</li>`).join('')}</ul></div>`;
  h+=`<h2>Тўлиқ жадвал (${rows.length} та сийға)</h2><div class="card"><table class="t">${rows.map(d=>`<tr><td class="a ar">${d.arabic}</td><td>${d.uzbek}<div class="small">${d.sigha}</div></td></tr>`).join('')}</table></div>`;
  h+=`<h2>Карточкалар</h2><div class="card flash" id="flash" tabindex="0" role="button" aria-label="Карточкани айлантириш"></div><div class="row"><button id="fPrev">←</button><button id="fFlip">Айлантириш</button><button id="fNext">→</button><button id="fShuf">Аралаштириш</button></div><p class="small" id="fCnt"></p>`;
  if(T.exs&&T.exs.length){h+=`<h2>Китобдаги машқлар</h2><p class="small">Бу машқларнинг жавоби китобда берилмаган. Сўзга босиб, бажарилганини белгилаб боринг. Ҳаракатлар китоб расмидан ўқилди; китобда баъзи сўзларда ҳаракат тўлиқ қўйилмаган.</p>`;
    T.exs.forEach(k=>{const e=EX[k];h+=`<div class="card"><b>${e.t}</b> <span class="small">(${e.b})</span><p>${e.x}</p>${e.w.length?`<div class="chips">${e.w.map(w=>`<button class="chip ar">${w}</button>`).join('')}</div>`:''}</div>`;});}
  h+=`<div class="row" style="margin-top:14px"><a class="btn primary" href="#" data-go="/tests" id="goTest">Шу мавзудан тест</a></div>`;
  h+=`<div class="row" style="margin-top:10px;justify-content:space-between">${prev?`<a class="btn" href="#" data-go="/learn/${prev.id}">← ${prev.name}</a>`:'<span></span>'}${next?`<a class="btn" href="#" data-go="/learn/${next.id}">${next.name} →</a>`:''}</div>`;
  root.innerHTML=h;
  $('#goTest').onclick=()=>{preselect=id;};
  root.querySelectorAll('.chip').forEach(b=>b.onclick=()=>b.classList.toggle('done'));
  initFlash(rows);
}
function initFlash(rows){
  let deck=shuffle(rows),i=0,flipped=false;
  const card=$('#flash');
  function draw(){const d=deck[i];card.innerHTML=flipped?`<div>${d.uzbek}</div><div class="sg">${d.sigha}</div>`:`<div class="ar">${d.arabic}</div><div class="sg">Айлантириш учун босинг</div>`;$('#fCnt').textContent=`${i+1} / ${deck.length}`;}
  const flip=()=>{flipped=!flipped;draw();},go=n=>{i=(i+n+deck.length)%deck.length;flipped=false;draw();};
  card.onclick=flip;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}};
  $('#fFlip').onclick=flip;$('#fPrev').onclick=()=>go(-1);$('#fNext').onclick=()=>go(1);$('#fShuf').onclick=()=>{deck=shuffle(rows);i=0;flipped=false;draw();};
  draw();
}

/* ---------- 3-бўлим: юлдузлар, сийғани топ, хатолар ---------- */
const POS={mozi:[60,60],mozi_majhul:[140,100],muzore:[230,55],muzore_majhul:[305,115],jahd:[70,185],jahd_majhul:[155,225],nafiy:[255,180],nafiy_majhul:[320,250],nahiy:[60,310],nahiy_majhul:[140,350],amr_hozir:[230,300],amr_goib:[300,375],amr_goib_majhul:[200,420]};
const LINKS=[['mozi','mozi_majhul'],['mozi_majhul','muzore'],['muzore','muzore_majhul'],['mozi_majhul','jahd_majhul'],['jahd','jahd_majhul'],['jahd_majhul','nafiy'],['nafiy','nafiy_majhul'],['jahd_majhul','nahiy_majhul'],['nahiy','nahiy_majhul'],['nahiy_majhul','amr_hozir'],['amr_hozir','amr_goib'],['amr_hozir','amr_goib_majhul'],['nafiy','amr_hozir']];
function starPts(cx,cy,R){const pts=[];for(let k=0;k<10;k++){const r=k%2?R*.45:R,a=-Math.PI/2+k*Math.PI/5;pts.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return pts.join(' ');}
const COL=['#5b6a9a','#9fb4ee','#f6e08f','#ffd34d'];
function renderStars(){
  showScreen('stars');
  let svg='<svg class="stars-svg" viewBox="0 0 360 470" role="group" aria-label="Юлдузлар харитаси">';
  LINKS.forEach(([a,b])=>{svg+=`<line x1="${POS[a][0]}" y1="${POS[a][1]}" x2="${POS[b][0]}" y2="${POS[b][1]}" stroke="rgba(160,180,255,.25)" stroke-width="1"/>`;});
  let lit=0;
  CATS.forEach(c=>{const [x,y]=POS[c.id],lv=level(c.id),R=[8,10,12,15][lv];if(lv>=2)lit++;
    const glow=lv>=2?`filter:drop-shadow(0 0 ${lv===3?9:5}px ${COL[lv]})`:'';
    svg+=`<a href="#" data-go="/learn/${c.id}" aria-label="${c.name}: ${LV[lv]}"><g><circle cx="${x}" cy="${y}" r="24" fill="transparent"/><polygon class="st" points="${starPts(x,y,R)}" fill="${COL[lv]}" style="${glow}"/><text x="${x}" y="${y+27}" text-anchor="middle" font-size="10" fill="#cdd6ff">${c.name}</text></g></a>`;});
  svg+='</svg>';
  const nb=Object.keys(store.notebook).length;
  let h=`<h1>Юлдузлар</h1><p class="sub">Ҳар бир мавзу — битта юлдуз. Сўнгги 20 та жавобингизга қараб ёнади.</p><div class="card">${svg}<div class="leg"><span>⭐ порлоқ: ≥85% (камида 10 та жавоб)</span><span>ёруғ: ≥60%</span><span>хира: &lt;60%</span><span>бошланмаган: &lt;5 жавоб</span></div></div>
  <p class="info">Ёруғ ва порлоқ юлдузлар: <b>${lit}</b> / ${CATS.length}. Юлдузга босиб, мавзуни ўрганишга ўтинг.</p>
  <a class="card" href="#" data-go="/sigha"><b>Сийғани топ</b><div class="small">Арабча шакл қайси сийғага тегишли эканини топинг</div></a>
  <a class="card" href="#" data-go="/notebook"><b>Хатолар дафтари</b><span class="pill">${nb} та</span><div class="small">Хато қилган шаклларингиз шу ерда сақланади</div></a>
  <h2>Мавзулар бўйича натижа</h2><div class="card"><table class="t">${CATS.map(c=>{const t=store.topics[c.id],n=t?t.recent.length:0,r=n?Math.round(t.recent.reduce((a,b)=>a+b,0)/n*100):0;return `<tr><td>${c.name}</td><td class="small">${LV[level(c.id)]}</td><td class="small">${n?r+'% ('+n+' та)':'—'}</td></tr>`;}).join('')}</table></div>
  <button class="link" id="reset">Натижаларни тозалаш</button>`;
  $('#s-stars').innerHTML=h;
  $('#reset').onclick=()=>ask($('#reset'),'Ҳаммаси тозаланади. Тасдиқлаш учун яна босинг',()=>{store={topics:{},notebook:{}};save();renderStars();});
}
function renderNotebook(){
  showScreen('notebook');
  const ids=Object.keys(store.notebook).filter(i=>byId[i]);
  let h=`<a class="link" href="#" data-go="/stars">← Юлдузлар</a><h1>Хатолар дафтари</h1>`;
  if(!ids.length){h+=`<div class="card">Ҳозирча хато йўқ. Тест ёки «Сийғани топ» машқини ечинг: хато қилган шаклларингиз шу ерда пайдо бўлади.</div>`;}
  else{
    h+=`<p class="sub">Шакл хатосиз икки марта қайта ечилса, дафтардан ўчади.</p><div class="row"><button class="primary" id="nbGo">Хатоларни машқ қил</button></div>`;
    ids.sort((a,b)=>store.notebook[b].wrong-store.notebook[a].wrong).forEach(i=>{const d=byId[i],e=store.notebook[i];
      h+=`<div class="card"><div class="ar" style="font-size:1.6rem;text-align:right">${d.arabic}</div><div>${d.uzbek}</div><div class="small">${d.categoryName} · ${d.sigha}</div><div class="small">Хато: ${e.wrong} · кетма-кет тўғри: ${e.streak}/2</div></div>`;});
  }
  $('#s-notebook').innerHTML=h;
  const go=$('#nbGo');if(go)go.onclick=()=>start(shuffle(ids.map(i=>byId[i])).slice(0,20),'all','/notebook');
}

/* ---------- бошланиш ---------- */
$$('input[name=dir]').forEach(i=>{});
route();
})();

</script>
</body></html>
